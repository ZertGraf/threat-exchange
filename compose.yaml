name: threat-exchange
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: threat
      POSTGRES_DB: threats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U threat -d threats']
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [database]

  api:
    build:
      context: .
      target: runtime
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://threat@db:5432/threats?sslmode=disable&pool_max_conns=10
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
      API_KEY: ${API_KEY:-}
      API_KEY_FILE: ${API_KEY_FILE:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-}
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 25s
    networks: [database, frontend]

networks:
  database:
    internal: true
  frontend:
volumes:
  postgres-data:
